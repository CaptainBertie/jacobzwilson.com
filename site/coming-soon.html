<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jacob Wilson</title>
<meta name="description" content="Engineering student at UTS, Sydney. Robots, mechanisms and software.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:opsz,wght@6..72,400&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141413'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23faf9f5'/%3E%3C/svg%3E">
<style>
  :root { --ink: #0a0a0f; --ink-2: #55555f; --clay: #7c3aed;
    --serif: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif; }
  html, body { margin: 0; height: 100%; background: #fff; }
  body { display: grid; place-items: center; min-height: 100svh; color: var(--ink);
    font-family: var(--sans); -webkit-font-smoothing: antialiased; letter-spacing: -.011em; }
  main { padding: 24px; text-align: center; }
  p { margin: 0; font-size: clamp(15px, 1.3vw, 19px); font-weight: 500; color: var(--ink-2); }
  h1 { margin: clamp(6px, 1.4vh, 18px) 0 0; font-family: var(--serif); font-weight: 400;
    font-size: clamp(54px, min(11vw, 23svh), 200px); line-height: .9; letter-spacing: -.04em; }
  h1 i { font-style: normal; color: var(--clay); }
</style>
</head>
<body>
<main>
  <p>Jacob Wilson</p>
  <h1>Coming soon<i>.</i></h1>
</main>
</body>
</html>
