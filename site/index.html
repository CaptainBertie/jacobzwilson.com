<script>
(() => {
  const S = window.SITE, esc = window.JW.esc;
  document.getElementById("kicker").textContent = S.kicker;
  const parts = S.name.split(" ");
  const first = parts.shift(), rest = parts.join(" ");
  document.getElementById("name").innerHTML = `<span class="line"><span>${esc(first)}</span></span>` + (rest ? `<span class="line"><span>${esc(rest)}</span></span>` : "");
  const n = window.PROJECTS.length;
  const years = window.PROJECTS.map(p => +p.year).filter(Boolean);
  document.getElementById("proj-count").textContent = `${n} builds` + (years.length ? `, ${Math.min(...years)}–${Math.max(...years)}` : "") + " · robots, mechanisms, software";
})();
</script>
