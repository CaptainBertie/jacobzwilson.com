<main id="main" class="contact">
  <figure class="headshot" style="margin:0"><img id="headshot" alt="Headshot" width="400" height="500"></figure>
  <div>
    <h1>Get in touch</h1>
    <p class="lead">Fastest reply is email.</p>
    <div class="links">
      <a class="key link" id="gh" target="_blank" rel="noopener">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg></span>
        <span class="txt"><span>GitHub</span><b id="gh-t"></b></span><span class="arrow">↗</span>
      </a>
      <a class="key link" id="li" target="_blank" rel="noopener">
        <span class="ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h3.5v11H4zM5.75 3.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM10 9h3.3v1.6c.5-.9 1.7-1.9 3.6-1.9 3.6 0 4.3 2.3 4.3 5.4V20h-3.5v-5.2c0-1.3 0-2.9-1.8-2.9s-2.1 1.4-2.1 2.8V20H10z"/></svg></span>
        <span class="txt"><span>LinkedIn</span><b id="li-t"></b></span><span class="arrow">↗</span>
      </a>
      <div class="link-row">
        <a class="key key--blue link" id="em">
          <span class="ico" style="background:#fff;color:#1d4cff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
          <span class="txt"><span style="color:rgba(255,255,255,.8)">Email</span><b id="em-t"></b></span>
        </a>
        <button class="key copy" id="copy" type="button">Copy</button>
      </div>
    </div>
  </div>
</main>
<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script>
(() => {
  const S = window.SITE;
  const short = (u) => u.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
  const set = (id, href, text) => { const a = document.getElementById(id); a.href = href; document.getElementById(id + "-t").textContent = text; };
  set("gh", S.github, short(S.github));
  set("li", S.linkedin, short(S.linkedin));
  set("em", "mailto:" + S.email, S.email);
  const img = document.getElementById("headshot");
  img.onerror = () => { img.onerror = null; img.src = window.JW.placeholder("HEADSHOT", "PHOTO PENDING", 800, 1000); };
  img.src = S.headshot;
  const btn = document.getElementById("copy");
  btn.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(S.email); } catch { const t = Object.assign(document.createElement("textarea"), { value: S.email }); document.body.append(t); t.select(); document.execCommand("copy"); t.remove(); }
    btn.textContent = "Copied"; btn.classList.add("done"); window.JW.toast("Email copied");
    setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("done"); }, 1600);
  });
})();
</script>
