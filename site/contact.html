  <figure class="headshot"><img id="headshot" alt="Jacob Wilson" width="440" height="550"></figure>

    <h1>Get in <span>touch</span></h1>
    <div class="links">
      <div class="item"><a class="link" id="gh" target="_blank" rel="noopener" data-press><span class="ico gh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></svg></span><b>GitHub</b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="chev" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></a></div>
      <div class="item"><a class="link" id="li" target="_blank" rel="noopener" data-press><span class="ico li"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h3.5v11H4zM5.75 3.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM10 9h3.3v1.6c.5-.9 1.7-1.9 3.6-1.9 3.6 0 4.3 2.3 4.3 5.4V20h-3.5v-5.2c0-1.3 0-2.9-1.8-2.9s-2.1 1.4-2.1 2.8V20H10z"/></svg></span><b>LinkedIn</b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="chev" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></a></div>
      <div class="item"><a class="link" id="em" data-press><span class="ico em"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg></span><b id="em-t"></b></a><button class="key key--icon copy" id="copy" type="button" aria-label="Copy email"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button></div>
    </div>
  </div>
</main>
<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script>
(() => {
  const S = window.SITE;
  document.getElementById("gh").href = S.github;
  document.getElementById("li").href = S.linkedin;
  document.getElementById("em").href = "mailto:" + S.email;
  document.getElementById("em-t").textContent = S.email;
  const img = document.getElementById("headshot");
  img.onerror = () => { img.onerror = null; img.src = window.JW.placeholder(1, 800, 1000); };
  img.src = S.headshot;
  const btn = document.getElementById("copy"), icon = btn.innerHTML;
  btn.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(S.email); } catch { const t = Object.assign(document.createElement("textarea"), { value: S.email }); document.body.append(t); t.select(); document.execCommand("copy"); t.remove(); }
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>`; btn.classList.add("done"); btn.setAttribute("aria-label", "Copied");
    setTimeout(() => { btn.innerHTML = icon; btn.classList.remove("done"); btn.setAttribute("aria-label", "Copy email"); }, 1500);
  });
})();
</script>
