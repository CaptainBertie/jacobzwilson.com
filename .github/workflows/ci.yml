name: CI

on:
  pull_request:
  push:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check every local file reference resolves
        run: python3 scripts/check_links.py

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the Railway image
        run: docker build -t site .

      - name: Smoke-test every page
        run: |
          docker run -d --rm -p 8080:8080 -e PORT=8080 --name site site
          for i in $(seq 1 20); do curl -fs http://localhost:8080/ >/dev/null && break; sleep 1; done
          for p in / index.html projects.html skills.html history.html contact.html css/site.css js/data.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/$p")
            echo "$p -> $code"; [ "$code" = 200 ] || exit 1
          done
          docker stop site
